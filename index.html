<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>리빙 트렌드 플래너</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">리빙 블로그 트렌드 플래너</p>
      <h1>오늘 뭐 쓰지? 버튼 하나로 기획 끝</h1>
      <p class="sub" id="today"></p>
    </header>

    <!-- 0단계: 블로그 프로필 -->
    <section id="profile-view" class="view" hidden>
      <div class="view-head">
        <h2>블로그 프로필</h2>
        <p class="hint">한 번만 저장해 두면 브리프에 내 블로그 스타일이 자동으로 들어가요. <span class="req">*</span> 필수</p>
      </div>
      <form id="profile-form" class="form" novalidate>
        <div class="field" data-field="field">
          <label for="p-field">블로그 분야 <span class="req">*</span></label>
          <input id="p-field" name="field" type="text" placeholder="예: 리빙·살림" />
          <p class="error"></p>
        </div>

        <fieldset class="field" data-field="categories">
          <legend>카테고리 (여러 개 선택) <span class="req">*</span></legend>
          <div class="chips" id="p-categories"></div>
          <input id="p-categories-extra" name="categoriesExtra" type="text" placeholder="목록에 없으면 직접 입력 (쉼표로 구분)" />
          <p class="error"></p>
        </fieldset>

        <div class="field" data-field="tone">
          <label for="p-tone">글 톤 <span class="req">*</span></label>
          <input id="p-tone" name="tone" type="text" placeholder="예: 친근한 존댓말, 직접 써 본 경험 위주, 장단점 솔직하게" />
          <p class="error"></p>
        </div>

        <div class="field" data-field="titleStyle">
          <label for="p-title-style">제목 스타일 <span class="req">*</span></label>
          <input id="p-title-style" name="titleStyle" type="text" placeholder="예: 연도 + 핵심 키워드 + 검색 의도(가격비교·방법·단점·사용법) + 질문형 훅" />
          <p class="error"></p>
        </div>

        <div class="field" data-field="keywords">
          <label for="p-keywords">관심 키워드 <span class="opt">(선택)</span></label>
          <input id="p-keywords" name="keywords" type="text" placeholder="예: 가습기, 김장, 수납, 전기요 (쉼표로 구분)" />
          <p class="help">비워 둬도 저장돼요. 추천 주제는 시즌·행사 기준으로 나와요.</p>
        </div>

        <div class="form-actions">
          <button type="button" id="profile-cancel" class="btn ghost" hidden>취소</button>
          <button type="submit" class="btn primary">프로필 저장</button>
        </div>
        <p id="profile-status" class="form-status" role="alert"></p>
      </form>
    </section>

    <!-- 1단계: 시작 -->
    <section id="start-view" class="view" hidden>
      <div class="profile-summary">
        <p id="profile-summary-text"></p>
        <button id="edit-profile-btn" class="btn ghost small">프로필 수정</button>
      </div>
      <button id="start-btn" class="btn primary large">오늘 기획 시작</button>
    </section>

    <!-- 2단계: 추천 주제 3개 -->
    <section id="topics-view" class="view" hidden>
      <div class="view-head">
        <h2>오늘의 추천 주제</h2>
        <p class="hint">쓰고 싶은 주제를 하나 골라 주세요.</p>
        <p class="sample-note">ⓘ 현재는 예시 트렌드 데이터예요</p>
      </div>
      <div id="topic-list" class="card-grid"></div>
    </section>

    <!-- 3단계: 포스팅 브리프 -->
    <section id="brief-view" class="view" hidden>
      <div class="view-head row">
        <button id="back-btn" class="btn ghost">← 다른 주제 고르기</button>
        <div class="brief-actions">
          <button id="copy-btn" class="btn primary">브리프 복사</button>
          <button id="open-chatgpt-btn" class="btn ghost" data-service="chatgpt">ChatGPT에서 열기 ↗</button>
          <button id="open-claude-btn" class="btn ghost" data-service="claude">Claude에서 열기 (붙여 넣기) ↗</button>
        </div>
      </div>
      <article id="brief" class="brief"></article>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- Claude 버튼용 안내: 화면 위쪽에 고정되어 스크롤 위치와 상관없이 보임 -->
  <div id="toast" class="toast" role="status" aria-live="assertive" hidden>
    <p id="toast-text"></p>
    <button type="button" id="toast-close" class="toast-close" aria-label="안내 닫기">×</button>
  </div>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
